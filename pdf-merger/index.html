<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Merger</title>

  <!-- Basic SEO -->
  <meta name="description"
    content="Online tool to merge multiple PDFs into one, fast and free, directly in your browser." />

  <link rel="icon" href="./index.html" type="image/x-icon" />

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
 <main class="container" role="main" aria-label="PDF Merger">
<h1>
  <img src="./pdf-icon.svg" alt="PDF Icon" width="40" height="40" style="vertical-align: middle; margin-right: 10px;" />
  PDF Merger
</h1>

  <p class="intro" id="intro">
    Merge PDFs fast and easy in your browser.
  </p>

  <div id="dropZone" class="drop-zone" aria-label="Drag and drop PDF files here or click to select files" tabindex="0">


<svg xmlns="http://www.w3.org/2000/svg" class="icon-upload" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="48" height="48" stroke-width="2" aria-hidden="true" focusable="false">
<path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
</svg>

    <p>Drag & drop PDF files here, or click to select files</p>
    <label for="fileInput" class="drop-zone-label">
      <input type="file" id="fileInput" multiple accept="application/pdf" hidden aria-label="Select PDF files" />
    </label>
  </div>

  <ul id="fileList" class="file-list" role="list" aria-live="polite" aria-relevant="additions removals"
    aria-label="List of selected PDF files"></ul>

  <button id="mergeBtn" disabled class="btn merge-btn" aria-disabled="true">
    Merge PDFs
  </button>

  <p id="status" class="status" aria-live="assertive" role="status"></p>
</main>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>

</html>
